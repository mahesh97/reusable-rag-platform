spring.application.name=ai-knowledge-assistant

server.port=8081
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/knowledge_db
spring.datasource.username=${DB_USERNAME:knowledge_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Document Storage
app.document.upload-dir=./uploads

# Multipart File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Ollama local embedding configuration
app.ollama.base-url=http://localhost:11434
app.ollama.embedding-model=bge-m3
app.ollama.embedding-dimensions=1024

# Anthropic Claude API Configuration
app.anthropic.base-url=https://api.anthropic.com
app.anthropic.messages-path=/v1/messages
app.anthropic.model=claude-sonnet-5
app.anthropic.api-version=2026-10-21
app.anthropic.api-key=${ANTHROPIC_API_KEY}
app.anthropic.max-tokens=1500
